# Render blueprint for the Perspect MCP connector.
# Deploy: Render -> New -> Blueprint -> connect this repo.
services:
  - type: web
    name: perspect-mcp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PERSPECT_API_URL
        value: https://perspect-ai-backend.onrender.com
